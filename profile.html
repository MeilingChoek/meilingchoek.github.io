<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #f5f8fa;
        background-image: url('https://i.pinimg.com/1200x/36/a0/85/36a085785eabcc6add04d35e8c97be37.jpg'); /* if local */
    }
    .account-box {
      max-width: 500px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #007bff;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="account-box text-center">
    <img src="https://i.pinimg.com/736x/7a/81/d0/7a81d0c87d1405753bf378fb4fb16ae0.jpg" class="avatar" alt="Avatar">
    <h4 id="name">My Name</h4>
    <p id="email" class="text-muted">Email</p>

    <div class="text-start mt-4">
      <p><i class="fa-solid fa-phone me-2"></i> <span id="phone">Phone</span></p>
      <p><i class="fa-solid fa-book me-2"></i> <span id="genre">Favorite Genre</span></p>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <a href="#" class="btn btn-outline-primary"><i class="fa-solid fa-pen"></i> Edit Profile</a>
      <a href="/index.html" class="btn btn-outline-danger" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> go back</a>
    </div>
  </div>

  <script>
    // Load user data from localStorage
    document.getElementById("name").innerText = localStorage.getItem("userName") || "CHEOK MEILING";
    document.getElementById("email").innerText = localStorage.getItem("userEmail") || "meilingmeiling02@gmail.com";
    document.getElementById("phone").innerText = localStorage.getItem("userPhone") || "+855 697 085 96";
    document.getElementById("genre").innerText = localStorage.getItem("userGenre") || "Female";

    function logout() {
      localStorage.clear();
    }
  </script>

</body>
</html>
